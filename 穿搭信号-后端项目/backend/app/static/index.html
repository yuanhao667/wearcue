<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>穿搭信号 · 后端集成验收</title>
  <style>
    :root{--ink:#151713;--muted:#6e7468;--paper:#f2f0e9;--card:#fff;--line:#dcded5;--lime:#c8ff48;--green:#24471d;--radius:24px;--shadow:0 18px 60px rgba(26,31,20,.09)}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}button,input,select{font:inherit}button{cursor:pointer}
    .shell{width:min(1180px,calc(100% - 32px));margin:0 auto;padding:28px 0 56px}.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 2px 24px}.brand{display:flex;align-items:center;gap:12px}.signal{width:36px;height:36px;border-radius:12px;background:var(--ink);position:relative}.signal:after{content:"";position:absolute;inset:8px;border:5px solid var(--lime);border-left-color:transparent;border-radius:50%;transform:rotate(-28deg)}.brand strong{font-size:16px;letter-spacing:-.02em}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.12em;text-transform:uppercase}.links{display:flex;gap:8px}.links a{color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:#ffffff80}
    .hero{display:grid;grid-template-columns:1.28fr .72fr;gap:18px;margin-bottom:18px}.weather,.control,.outfit,.assets{border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.weather{min-height:285px;padding:28px;background:var(--ink);color:#fff;position:relative;overflow:hidden}.weather:after{content:"";position:absolute;width:250px;height:250px;border:38px solid #c8ff4830;border-radius:50%;right:-86px;top:-110px}.eyebrow{font:800 10px/1 ui-monospace,SFMono-Regular,monospace;letter-spacing:.16em;text-transform:uppercase;color:#959b8e}.weather .eyebrow{color:#9fa699}.weather-head{display:flex;justify-content:space-between;gap:20px;position:relative;z-index:1}.weather h1{margin:28px 0 2px;font-size:44px;line-height:1;letter-spacing:-.07em}.weather .city{color:#cbd0c5}.current-temp{font-size:72px;font-weight:800;line-height:.9;letter-spacing:-.09em}.current-temp sup{font-size:22px;color:var(--lime)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:42px;border-top:1px solid #393d35;position:relative;z-index:1}.metric{padding:18px 15px 0;border-left:1px solid #393d35}.metric:first-child{padding-left:0;border-left:0}.metric span{display:block;color:#979e90;font-size:10px}.metric strong{display:block;margin-top:6px;font:800 18px/1 ui-monospace,monospace}
    .control{padding:24px;background:var(--card)}.control h2,.outfit h2,.assets h2{margin:8px 0 20px;font-size:24px;line-height:1.1;letter-spacing:-.05em}.field{margin-bottom:15px}.field label{display:block;margin-bottom:6px;color:var(--muted);font-size:11px;font-weight:700}.row{display:grid;grid-template-columns:1fr auto;gap:8px}.field input,.field select{width:100%;height:42px;border:1px solid var(--line);border-radius:12px;background:#f8f8f4;padding:0 12px;color:var(--ink);outline:0}.field input:focus,.field select:focus{border-color:#8faa46;box-shadow:0 0 0 3px #c8ff482d}.segmented{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.segmented button{height:38px;border:1px solid var(--line);border-radius:11px;background:#f8f8f4;color:var(--muted)}.segmented button.active{background:var(--ink);border-color:var(--ink);color:var(--lime)}.primary{width:100%;height:46px;border:0;border-radius:13px;background:var(--lime);color:#1b2412;font-weight:850}.primary:disabled{opacity:.55;cursor:wait}.status-line{display:flex;align-items:center;gap:7px;margin-top:13px;color:var(--muted);font-size:11px}.dot{width:7px;height:7px;border-radius:50%;background:#aeb2aa}.dot.live{background:#6fd451;box-shadow:0 0 0 4px #6fd45122}
    .outfit{padding:26px;background:var(--card);margin-bottom:18px}.outfit-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.source{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:#edf6d7;padding:7px 10px;color:#415719;font-size:10px;font-weight:800}.source:before{content:"";width:6px;height:6px;border-radius:50%;background:#89b626}.swap{height:40px;padding:0 15px;border:1px solid var(--line);border-radius:12px;background:#fff;font-weight:750}.swap:disabled{opacity:.45}.garment-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:24px}.garment{min-width:0;border:1px solid var(--line);border-radius:18px;padding:17px;background:#fafaf6}.garment-art{height:110px;border-radius:14px;background:#eeefe8;display:grid;place-items:center;margin-bottom:14px}.mask{width:78px;height:78px;background:var(--tone,#222);-webkit-mask:var(--asset) center/contain no-repeat;mask:var(--asset) center/contain no-repeat}.garment small{color:var(--muted);font-size:9px;text-transform:uppercase}.garment strong{display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.swatch{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--tone);border:1px solid #0002}.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:20px}.tag{border:1px solid var(--line);border-radius:999px;padding:6px 9px;background:#f6f7f1;color:#555d4e;font-size:10px}.tag.warn{background:#fff1d4;border-color:#edd6a6;color:#805e1b}.empty{display:grid;place-items:center;min-height:260px;color:var(--muted);text-align:center}.empty b{display:block;color:var(--ink);font-size:20px;margin-bottom:6px}
    .assets{padding:24px;background:var(--card);margin-bottom:18px}.asset-head{display:flex;justify-content:space-between;align-items:flex-start}.asset-counts{display:flex;gap:8px;flex-wrap:wrap}.asset-counts span{border-radius:999px;padding:7px 10px;background:#f1f2eb;color:var(--muted);font-size:10px}.asset-strip{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:16px}.asset-tile{min-height:112px;border:1px solid var(--line);border-radius:14px;background:#fafaf6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:8px;text-align:center}.asset-tile .mask{width:54px;height:54px;background:#34382f}.asset-tile small{color:#676d63;font-size:9px;line-height:1.2}.capability-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}.capability-card{border:1px solid var(--line);border-radius:14px;background:#fafaf6;padding:14px}.capability-card strong{display:block;margin-top:5px}.capability-card small{font-size:10px;font-weight:800}.capability-card.done small{color:#477827}.capability-card.todo small{color:#a36822}.error{padding:13px;border-radius:12px;background:#fff0ec;color:#9c3427;font-size:12px;margin-top:12px}.hidden{display:none!important}
    @media(max-width:820px){.hero{grid-template-columns:1fr}.garment-grid{grid-template-columns:repeat(2,1fr)}.asset-strip,.capability-grid{grid-template-columns:repeat(2,1fr)}.metrics{grid-template-columns:repeat(2,1fr);row-gap:16px}.metric:nth-child(3){padding-left:0;border-left:0}.current-temp{font-size:58px}}
    @media(max-width:520px){.shell{width:min(100% - 20px,1180px);padding-top:16px}.topbar{align-items:flex-start}.links a:first-child{display:none}.weather,.control,.outfit,.assets{border-radius:20px}.weather{padding:22px}.weather h1{font-size:35px}.current-temp{font-size:48px}.garment-grid{grid-template-columns:1fr 1fr}.garment-art{height:92px}.asset-strip{grid-template-columns:repeat(3,1fr)}.capability-grid{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><span class="signal"></span><div><strong>穿搭信号</strong><small>Backend integrated preview</small></div></div>
      <nav class="links"><a href="/assets-review">最终素材</a><a href="/docs">API 文档</a><a href="/api/v1/health">健康检查</a></nav>
    </header>

    <section class="hero">
      <article class="weather" aria-live="polite">
        <div class="eyebrow">01 / 今日天气信号</div>
        <div class="weather-head">
          <div><h1 id="condition">正在读取天气</h1><div class="city" id="cityLabel">北京 · 全天逐小时</div></div>
          <div class="current-temp"><span id="temperature">--</span><sup>°</sup></div>
        </div>
        <div class="metrics">
          <div class="metric"><span>全天体感</span><strong id="apparentRange">--</strong></div>
          <div class="metric"><span>降水概率</span><strong id="rainMetric">--</strong></div>
          <div class="metric"><span>最大阵风</span><strong id="windMetric">--</strong></div>
          <div class="metric"><span>紫外线</span><strong id="uvMetric">--</strong></div>
        </div>
      </article>

      <aside class="control">
        <div class="eyebrow">02 / 验收控制台</div><h2>调整输入</h2>
        <div class="field"><label for="cityInput">城市</label><div class="row"><input id="cityInput" value="北京" autocomplete="off"><button class="swap" id="cityButton">查询</button></div></div>
        <div class="field"><label>使用场景</label><div class="segmented" id="sceneGroup"><button data-value="commute" class="active">通勤</button><button data-value="date">约会</button><button data-value="travel">出行</button></div></div>
        <div class="field"><label>服装素材库</label><div class="segmented" id="audienceGroup"><button data-value="mens" class="active">男性</button><button data-value="womens">女性</button><button data-value="mens" disabled>配件通用</button></div></div>
        <div class="field"><label for="offset">个人体感偏移</label><select id="offset"><option value="-6">更怕冷 −6℃</option><option value="-4">更怕冷 −4℃</option><option value="-2">更怕冷 −2℃</option><option value="0" selected>标准 0℃</option><option value="2">更耐冷 +2℃</option><option value="4">更耐冷 +4℃</option><option value="6">更耐冷 +6℃</option></select></div>
        <button class="primary" id="generate">生成今日穿搭</button>
        <div class="status-line"><span class="dot" id="statusDot"></span><span id="statusText">正在连接后端</span></div>
        <div class="error hidden" id="errorBox"></div>
      </aside>
    </section>

    <section class="outfit">
      <div class="outfit-head"><div><div class="eyebrow">03 / 今日穿搭建议</div><h2 id="outfitTitle">等待生成</h2><span class="source hidden" id="sourceBadge">官方模板兜底</span></div><button class="swap" id="swapButton" disabled>换一套 ↻</button></div>
      <div class="empty" id="emptyState"><div><b>天气硬条件优先</b>加载天气后，从官方模板中给出一套可执行方案。</div></div>
      <div class="garment-grid hidden" id="garmentGrid"></div>
      <div class="tags hidden" id="constraintTags"></div>
    </section>

    <section class="assets">
      <div class="asset-head"><div><div class="eyebrow">04 / 可复用素材</div><h2>精简素材库</h2></div><div class="asset-counts"><span>男装 17</span><span>女装 20</span><span>配件 4</span></div></div>
      <div class="asset-strip" id="assetStrip"></div>
    </section>

    <section class="assets">
      <div class="asset-head"><div><div class="eyebrow">05 / 上线能力</div><h2>后端完成度</h2></div><div class="asset-counts"><span>绿色可验收</span><span>橙色待实现</span></div></div>
      <div class="capability-grid" id="capabilityGrid"></div>
    </section>

    <section class="assets">
      <div class="asset-head"><div><div class="eyebrow">06 / 运行状态</div><h2>后端闭环检查</h2></div><button class="swap" id="runtimeButton">重新检查</button></div>
      <div class="capability-grid" id="runtimeGrid"></div>
    </section>
  </main>

  <script>
    const state={scene:"commute",audience:"mens",city:null,weather:null,shown:[]};
    const $=id=>document.getElementById(id);
    const colorMap={"黑色":"#222522","深色":"#30342d","深灰":"#545b54","灰黑":"#464b46","浅灰":"#aeb5ad","银灰":"#9fa9aa","灰色":"#858b86","石墨灰":"#555b57","炭灰":"#4d524f","麻灰":"#a3a69e","白色":"#e9ece5","奶白":"#e8e1cf","米白":"#e9dfc9","奶油白":"#eee2bd","基础色":"#687063","卡其":"#b19a69","藏蓝":"#273753","浅蓝":"#8bb7d2","灰绿":"#728579","橄榄绿":"#71814c","棕色":"#86634c","冰灰":"#c4cfce"};
    const conditionLabel=code=>code===0?"晴":code<=3?"多云":[45,48].includes(code)?"有雾":code>=71&&code<=77?"下雪":code>=95?"雷雨":code>=51&&code<=67?"有雨":code>=80&&code<=82?"阵雨":"天气变化";
    const iconPath=key=>{const base=`/assets/garments/${state.audience}`;const accessories="/assets/garments/accessories";const map={short_sleeve:`${base}/top_tshirt_short.svg`,long_sleeve:`${base}/top_tshirt_long.svg`,short_or_long_sleeve:`${base}/top_tshirt_long.svg`,warm_top:`${base}/top_knit.svg`,light_outerwear:`${base}/outer_light_jacket.svg`,warm_outerwear:`${base}/outer_down_short.svg`,protective_outerwear:`${base}/outer_shell.svg`,short_bottom:`${base}/bottom_shorts.svg`,long_bottom:`${base}/bottom_casual_pants.svg`,warm_bottom:`${base}/bottom_sweatpants.svg`,daily_shoes:`${base}/shoe_sneaker.svg`,protective_shoes:`${base}/shoe_canvas.svg`,acc_umbrella:`${accessories}/acc_umbrella.svg`,acc_gloves:`${accessories}/acc_gloves.svg`,acc_baseball_cap:`${accessories}/acc_baseball_cap.svg`};return map[key]||`${base}/top_tshirt_short.svg`};
    const setStatus=(text,live=false)=>{$("statusText").textContent=text;$("statusDot").classList.toggle("live",live)};
    const showError=message=>{$("errorBox").textContent=message;$("errorBox").classList.toggle("hidden",!message)};
    async function json(url,options){const response=await fetch(url,options);const payload=await response.json();if(!response.ok)throw new Error(payload?.error?.message||payload?.detail||"请求失败");return payload}
    function bindSegments(id,key){$(id).querySelectorAll("button:not([disabled])").forEach(button=>button.addEventListener("click",()=>{$(id).querySelector(".active")?.classList.remove("active");button.classList.add("active");state[key]=button.dataset.value;state.shown=[];if(state.weather)generate(false)}))}
    function renderWeather(){const w=state.weather;$("condition").textContent=conditionLabel(w.weather_code);$("cityLabel").textContent=`${w.city} · ${w.date} · 全天逐小时`;$("temperature").textContent=`${Math.round(w.temperature_min)}–${Math.round(w.temperature_max)}`;$("apparentRange").textContent=`${Math.round(w.apparent_min)}–${Math.round(w.apparent_max)}°`;$("rainMetric").textContent=`${Math.round(w.max_precipitation_probability)}%`;$("windMetric").textContent=`${Math.round(w.max_wind_gust)} km/h`;$("uvMetric").textContent=Math.round(w.uv_index_max)}
    function itemCard(item){const card=document.createElement("article");card.className="garment";const art=document.createElement("div");art.className="garment-art";const mask=document.createElement("span");mask.className="mask";const tone=colorMap[item.color_name]||"#596158";mask.style.setProperty("--tone",tone);mask.style.setProperty("--asset",`url('${iconPath(item.functional_icon_key)}')`);art.append(mask);const meta=document.createElement("small");meta.textContent=item.slot==="equipment"?"装备":({top:"上装",bottom:"下装",outerwear:"外套",shoes:"鞋履"}[item.slot]||item.slot);const name=document.createElement("strong");name.textContent=item.variant_type;const color=document.createElement("div");color.style.cssText="margin-top:7px;color:#777d72;font-size:10px";const swatch=document.createElement("span");swatch.className="swatch";swatch.style.setProperty("--tone",tone);color.append(swatch,document.createTextNode(`${item.color_name} · ${item.thickness||"常规"}`));card.append(art,meta,name,color);return card}
    function renderRecommendation(result){$("outfitTitle").textContent=result.label;$("sourceBadge").textContent=result.source==="personal"?"我的穿搭优先":"官方模板兜底";$("sourceBadge").classList.remove("hidden");$("emptyState").classList.add("hidden");const grid=$("garmentGrid");grid.replaceChildren(...result.items.map(itemCard));grid.classList.remove("hidden");const c=result.constraints;const values=[`${Math.round(c.calibrated_apparent_min)}° 校准体感`,`${c.apparent_delta}° 温差`,c.needs_removable_layer&&"需要可脱层",c.needs_waterproof&&"雨天防护",c.needs_snow_protection&&"防雪防滑",c.needs_windproof&&"防风外层",c.needs_sun_protection&&"注意防晒"].filter(Boolean);const tags=$("constraintTags");tags.replaceChildren(...values.map((value,index)=>{const tag=document.createElement("span");tag.className=`tag ${index>1?"warn":""}`;tag.textContent=value;return tag}));tags.classList.remove("hidden");$("swapButton").disabled=false}
    function recommendationBody(){const w=state.weather;return{apparent_min:w.apparent_min,apparent_max:w.apparent_max,max_precipitation_probability:w.max_precipitation_probability,total_precipitation:w.total_precipitation,total_snowfall:w.total_snowfall,max_wind_speed:w.max_wind_speed,max_wind_gust:w.max_wind_gust,uv_index_max:w.uv_index_max,cold_offset:Number($("offset").value),scene:state.scene,audience:state.audience,city_id:state.city.id,local_date:w.date,excluded_template_ids:state.shown}}
    async function generate(swap){if(!state.weather)return;showError("");$("generate").disabled=true;setStatus(swap?"正在匹配下一套":"正在计算天气硬条件");try{const result=await json(`/api/v1/recommendations/${swap?"swap":"preview"}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(recommendationBody())});state.shown.push(result.template_id);renderRecommendation(result);setStatus(`后端正常 · 规则版本 ${result.constraints.rule_version}`,true)}catch(error){showError(error.message);setStatus("没有更多可用方案");$("swapButton").disabled=true}finally{$("generate").disabled=false}}
    async function loadCity(){showError("");setStatus("正在搜索城市");try{const cities=await json(`/api/v1/cities?q=${encodeURIComponent($("cityInput").value.trim())}`);if(!cities.length)throw new Error("没有找到这个城市");state.city=cities[0];state.shown=[];setStatus("正在读取全天天气");const data=await json(`/api/v1/weather/today?latitude=${state.city.latitude}&longitude=${state.city.longitude}&city=${encodeURIComponent(state.city.name)}`);state.weather=data.weather;renderWeather();await generate(false)}catch(error){showError(error.message);setStatus("后端请求失败")}}
    async function loadAssets(){try{const labels={top_tank:"背心",top_camisole:"吊带",top_tshirt_short:"短袖 T 恤",top_tshirt_long:"长袖 T 恤",top_shirt:"长袖衬衫",top_sweatshirt:"卫衣",top_knit:"厚针织衫",top_knit_vest:"针织背心",outer_light_jacket:"薄款外套",outer_wool_coat:"厚大衣",outer_down_short:"厚羽绒服",outer_shell:"冲锋衣",bottom_shorts:"短裤",bottom_casual_pants:"常规长裤",bottom_sweatpants:"保暖长裤",bottom_skirt_short:"短裙",bottom_skirt_long:"长裙",onepiece_dress:"连衣裙",shoe_sneaker:"低帮鞋",shoe_canvas:"高帮鞋",shoe_leather:"正装皮鞋",shoe_pump:"高跟鞋",acc_umbrella:"雨伞",acc_baseball_cap:"棒球帽",acc_gloves:"手套",acc_beanie:"针织帽"};const [clothes,accessories]=await Promise.all([json(`/api/v1/garment-assets?collection=${state.audience}`),json("/api/v1/garment-assets?collection=accessories")]);const assets=[...clothes,...accessories];$("assetStrip").replaceChildren(...assets.map(asset=>{const tile=document.createElement("div");tile.className="asset-tile";tile.title=asset.key;const mask=document.createElement("span");mask.className="mask";mask.style.setProperty("--asset",`url('${asset.url}?v=20260827q')`);const label=document.createElement("small");label.textContent=labels[asset.key]||asset.key;tile.append(mask,label);return tile}))}catch{}}
    async function loadCapabilities(){try{const labels={weather_provider:"全天逐小时天气",deterministic_rules:"确定性穿衣规则",official_recommendations:"官方模板与换一套",garment_assets:"41 个 SVG 图标",production_entry:"云端启动入口",user_settings:"用户设置",persistence:"本地数据持久化",personal_outfits:"我的穿搭优先",garment_details:"衣物素材详情",image_upload:"图片上传与缩略图",vision_workflow:"识别确认流程（Mock）",notification_workflow:"提醒订阅与幂等",comfort_feedback:"跳过与冷热反馈",vision_provider_configured:"生产 AI Provider",web_push_provider_configured:"生产 Web Push Provider",cloud_database_configured:"云数据库",object_storage_configured:"云端图片存储"};const data=await json("/api/v1/capabilities");$("capabilityGrid").replaceChildren(...Object.entries(data).map(([key,done])=>{const card=document.createElement("article");card.className=`capability-card ${done?"done":"todo"}`;const status=document.createElement("small");status.textContent=done?"● 已跑通":"○ 待配置";const name=document.createElement("strong");name.textContent=labels[key]||key;card.append(status,name);return card}))}catch{}}
    async function loadRuntime(){try{const [runtime,settings,outfits,inspirations]=await Promise.all([json("/api/v1/runtime-status"),json("/api/v1/settings"),json("/api/v1/outfits"),json("/api/v1/inspirations")]);const rows=[["SQLite",runtime.persistence.ready,"设置与业务状态已落盘"],["图片处理",runtime.uploads.ready,`${Math.round(runtime.uploads.max_bytes/1048576)} MB 上限`],["个人设置",true,`${settings.city_name} · ${settings.reminder_time}`],["我的穿搭",true,`${outfits.length} 套`],["识别任务",true,`${inspirations.length} 个`],["生产外部服务",runtime.vision.production_configured&&runtime.web_push.production_configured,"AI / Push 密钥"]];$("runtimeGrid").replaceChildren(...rows.map(([name,done,detail])=>{const card=document.createElement("article");card.className=`capability-card ${done?"done":"todo"}`;const status=document.createElement("small");status.textContent=done?"● 正常":"○ 待配置";const title=document.createElement("strong");title.textContent=name;const note=document.createElement("div");note.style.cssText="margin-top:5px;color:#777d72;font-size:10px";note.textContent=detail;card.append(status,title,note);return card}))}catch(error){showError(error.message)}}
    bindSegments("sceneGroup","scene");bindSegments("audienceGroup","audience");
    $("audienceGroup").addEventListener("click",loadAssets);$("offset").addEventListener("change",()=>{state.shown=[];generate(false)});$("generate").addEventListener("click",()=>{state.shown=[];generate(false)});$("swapButton").addEventListener("click",()=>generate(true));$("cityButton").addEventListener("click",loadCity);$("cityInput").addEventListener("keydown",event=>{if(event.key==="Enter")loadCity()});$("runtimeButton").addEventListener("click",loadRuntime);
    Promise.all([loadCity(),loadAssets(),loadCapabilities(),loadRuntime()]);
  </script>
